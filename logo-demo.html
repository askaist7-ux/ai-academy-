<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Academy 인터랙티브 로고</title><style>@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css");

:root {
  --c1: #3fb6e8; --c2: #7b7fe8; --c1d: #1d8fc0; --c2d: #5a5ed0;
  --grad: linear-gradient(135deg, #3fb6e8 0%, #7b7fe8 100%);
  --ink: #0b1020; --ink2: #2a3150; --muted: #5d6479; --line: #e5e8f1; --soft: #f4f6fb; --bg: #fff;
  --navy: #0a1233; --navy2: #101c4d;
  --ok: #14a37f; --warn: #e6a100; --bad: #e0445a;
  --r: 18px; --shadow: 0 10px 40px rgba(20, 30, 80, .10);
  --font: "Pretendard Variable", Pretendard, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--bg); line-height: 1.6; -webkit-font-smoothing: antialiased; letter-spacing: -.01em; }
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
.container { width: min(1200px, 100% - 48px); margin-inline: auto; }
.grad-text { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* demo bar */
.demo-bar { background: #fff6d6; color: #6a5200; font-size: 13px; text-align: center; padding: 8px 16px; border-bottom: 1px solid #f1df9a; position: relative; z-index: 60; }

/* header */
.hd { position: sticky; top: 0; z-index: 50; background: rgba(255, 255, 255, .86); backdrop-filter: saturate(180%) blur(14px); border-bottom: 1px solid var(--line); }
.hd__in { display: flex; align-items: center; gap: 28px; height: 72px; }
.hd__logo img { height: 30px; width: auto; }
.hd__nav { display: flex; gap: 26px; margin-left: 12px; font-weight: 600; font-size: 15px; color: var(--ink2); }
.hd__nav a { position: relative; padding: 6px 0; }
.hd__nav a::after { content: ""; position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: var(--grad); transition: width .25s; }
.hd__nav a:hover::after { width: 100%; }
.hd__auth { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.hd__who { font-size: 14px; font-weight: 600; color: var(--muted); margin-right: 4px; }
.hd__burger { display: none; margin-left: auto; width: 40px; height: 40px; border: 0; background: none; position: relative; }
.hd__burger span { position: absolute; left: 9px; right: 9px; height: 2px; background: var(--ink); transition: .25s; }
.hd__burger span:first-child { top: 15px; } .hd__burger span:last-child { top: 23px; }
.nav-open .hd__burger span:first-child { top: 19px; transform: rotate(45deg); } .nav-open .hd__burger span:last-child { top: 19px; transform: rotate(-45deg); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 24px; border-radius: 999px; border: 1.5px solid transparent; font-weight: 700; font-size: 15px; transition: transform .15s, box-shadow .2s, background .2s, color .2s; white-space: nowrap; }
.btn:hover { transform: translateY(-2px); }
.btn:disabled { opacity: .55; pointer-events: none; }
.btn--sm { padding: 9px 16px; font-size: 13.5px; }
.btn--lg { padding: 18px 32px; font-size: 17px; }
.btn--grad { background: var(--grad); color: #fff; box-shadow: 0 8px 24px rgba(91, 110, 232, .35); }
.btn--grad:hover { box-shadow: 0 12px 32px rgba(91, 110, 232, .45); }
.btn--dark { background: var(--ink); color: #fff; }
.btn--ghost { background: #fff; border-color: var(--line); color: var(--ink); }
.btn--ghost:hover { border-color: var(--c2); color: var(--c2d); }
.btn--line { background: transparent; border-color: rgba(255, 255, 255, .4); color: #fff; }
.btn--line:hover { background: rgba(255, 255, 255, .1); }
.btn--block { width: 100%; }
.btn--danger { background: #fff; border-color: #f3c6cd; color: var(--bad); }

/* hero */
.hero { position: relative; overflow: hidden; padding: 72px 0 0; background:
  radial-gradient(900px 500px at 85% 10%, rgba(123, 127, 232, .16), transparent 60%),
  radial-gradient(700px 420px at 0% 0%, rgba(63, 182, 232, .14), transparent 60%), #fff; }
.hero__in { display: grid; grid-template-columns: 1.15fr .85fr; align-items: end; gap: 24px; }
.kicker { display: inline-flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 800; letter-spacing: .14em; color: var(--c2d); text-transform: uppercase; }
.kicker::before { content: ""; width: 28px; height: 3px; border-radius: 2px; background: var(--grad); }
.hero h1 { font-size: clamp(42px, 6.6vw, 92px); line-height: 1.04; letter-spacing: -.045em; font-weight: 800; margin: 22px 0 22px; }
.hero__sub { font-size: clamp(16px, 1.6vw, 20px); color: var(--muted); max-width: 560px; margin: 0 0 34px; }
.hero__cta { display: flex; gap: 12px; flex-wrap: wrap; padding-bottom: 72px; }
.hero__art { position: relative; align-self: end; min-height: 520px; display: flex; justify-content: center; align-items: flex-end; }
.hero__circle { position: absolute; width: min(480px, 92%); aspect-ratio: 1; border-radius: 50%; background: var(--grad); bottom: 40px; left: 50%; transform: translateX(-50%); opacity: .95; }
.hero__art img { position: relative; width: min(470px, 100%); filter: drop-shadow(0 20px 30px rgba(10, 18, 51, .22)); }
.hero__badge { position: absolute; z-index: 2; background: #fff; border-radius: 16px; padding: 12px 16px; box-shadow: var(--shadow); font-size: 13px; font-weight: 700; line-height: 1.35; }
.hero__badge small { display: block; color: var(--muted); font-weight: 500; }
.hero__badge--a { left: 0; top: 90px; } .hero__badge--b { right: 0; bottom: 120px; }
.instructor { display: inline-flex; gap: 14px; align-items: center; margin-bottom: 26px; padding-left: 14px; border-left: 4px solid var(--c1); }
.instructor b { display: block; font-size: 20px; } .instructor small { color: var(--muted); font-size: 14px; }

.marquee { overflow: hidden; background: var(--navy); color: #fff; padding: 18px 0; }
.marquee__t { display: flex; gap: 48px; width: max-content; animation: mq 28s linear infinite; font-weight: 800; letter-spacing: .12em; font-size: 15px; }
.marquee__t span { display: inline-flex; align-items: center; gap: 48px; } .marquee__t span::after { content: "✦"; color: var(--c1); }
@keyframes mq { to { transform: translateX(-50%); } }

/* sections */
.sec { padding: clamp(72px, 9vw, 130px) 0; }
.sec--soft { background: var(--soft); }
.sec--dark { background: var(--navy); color: #fff; }
.sec__h { max-width: 820px; margin-bottom: 56px; }
.sec__h h2 { font-size: clamp(32px, 4.4vw, 60px); line-height: 1.1; letter-spacing: -.04em; font-weight: 800; margin: 16px 0 14px; }
.sec__h p { color: var(--muted); font-size: 18px; margin: 0; }
.sec--dark .sec__h p { color: #aab3d6; }
.sec--dark .kicker { color: var(--c1); }

/* course cards */
.courses { display: grid; gap: 28px; }
.course { display: grid; grid-template-columns: 96px 1.2fr 1fr; gap: 36px; background: #fff; border: 1px solid var(--line); border-radius: 28px; padding: 40px; transition: box-shadow .3s, transform .3s, border-color .3s; }
.course:hover { box-shadow: var(--shadow); transform: translateY(-4px); border-color: #cfd5f7; }
.course__no { font-size: 72px; font-weight: 800; line-height: 1; letter-spacing: -.05em; }
.course__k { font-size: 12.5px; font-weight: 800; letter-spacing: .14em; color: var(--c2d); }
.course h3 { font-size: clamp(26px, 2.8vw, 38px); line-height: 1.18; margin: 10px 0 14px; letter-spacing: -.035em; }
.course__sum { color: var(--muted); margin: 0 0 20px; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.tag { font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: var(--soft); color: var(--ink2); }
.meta { display: grid; grid-template-columns: 90px 1fr; gap: 10px 14px; font-size: 14.5px; margin: 0 0 22px; }
.meta dt { color: var(--muted); font-weight: 600; } .meta dd { margin: 0; font-weight: 600; }
.meta .big { font-size: 22px; font-weight: 800; }
.meta .old { text-decoration: line-through; color: #9aa1b5; font-weight: 500; margin-right: 8px; font-size: 14px; }
.meta .off { color: var(--bad); font-weight: 800; font-size: 14px; margin-right: 6px; }
.earn { background: linear-gradient(135deg, rgba(63, 182, 232, .1), rgba(123, 127, 232, .14)); border-radius: 16px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
.earn span { font-size: 13.5px; font-weight: 700; color: var(--ink2); } .earn b { font-size: 24px; letter-spacing: -.03em; }
.actions { display: grid; gap: 10px; }
.actions .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
details.cur { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 14px; }
details.cur summary { cursor: pointer; font-weight: 700; list-style: none; display: flex; justify-content: space-between; }
details.cur summary::after { content: "+"; font-size: 22px; line-height: 1; color: var(--c2d); }
details.cur[open] summary::after { content: "–"; }
.cur ol { margin: 12px 0 0; padding: 0; list-style: none; counter-reset: c; display: grid; gap: 10px; }
.cur li { counter-increment: c; position: relative; padding-left: 40px; font-size: 14.5px; }
.cur li::before { content: counter(c, decimal-leading-zero); position: absolute; left: 0; top: 0; font-weight: 800; color: var(--c2d); }
.cur li b { display: block; } .cur li span { color: var(--muted); }

/* revenue */
.rev { display: grid; grid-template-columns: 1.1fr .9fr; gap: 40px; align-items: stretch; }
.rev__card { border-radius: 28px; padding: 44px; background: var(--navy2); border: 1px solid rgba(255, 255, 255, .08); }
.rev__eq { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin: 22px 0; }
.rev__n small { display: block; color: #aab3d6; font-size: 13px; font-weight: 600; }
.rev__n b { font-size: clamp(34px, 4.4vw, 60px); letter-spacing: -.04em; line-height: 1.1; }
.rev__op { font-size: 30px; color: var(--c1); font-weight: 800; }
.bar { height: 14px; border-radius: 999px; background: rgba(255, 255, 255, .12); overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; width: 50%; background: var(--grad); border-radius: 999px; }
.rev__list { display: grid; gap: 14px; align-content: center; }
.rev__li { display: flex; gap: 16px; padding: 22px 24px; border-radius: 20px; background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .08); }
.rev__li em { font-style: normal; font-weight: 800; color: var(--c1); font-size: 22px; }
.rev__li b { display: block; font-size: 17px; } .rev__li span { color: #aab3d6; font-size: 14.5px; }

/* steps */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; counter-reset: s; }
.step { background: #fff; border: 1px solid var(--line); border-radius: 24px; padding: 30px 26px; position: relative; }
.step::before { counter-increment: s; content: "0" counter(s); display: block; font-size: 44px; font-weight: 800; letter-spacing: -.04em; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 14px; }
.step h4 { margin: 0 0 8px; font-size: 19px; } .step p { margin: 0; color: var(--muted); font-size: 14.5px; }
.cta-band { background: var(--grad); color: #fff; border-radius: 32px; padding: clamp(36px, 5vw, 64px); display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap; }
.cta-band h3 { font-size: clamp(26px, 3.4vw, 44px); line-height: 1.15; letter-spacing: -.04em; margin: 0; }
.cta-band .btn { background: #fff; color: var(--c2d); }

/* footer */
.ft { background: var(--navy); color: #cdd3ee; padding: 64px 0 56px; }
.ft__in { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 40px; }
.ft__logo { height: 32px; width: auto; } .ft__tag { letter-spacing: .18em; font-size: 12px; font-weight: 700; color: #7f88b3; margin-top: 18px; }
.ft__c { display: grid; gap: 6px; align-content: start; font-size: 14.5px; } .ft__c b { color: #fff; margin-bottom: 6px; }

/* auth / app shells */
.shell { min-height: calc(100vh - 72px); background: var(--soft); padding: 48px 0 80px; }
.auth { width: min(980px, 100% - 32px); margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; background: #fff; border-radius: 32px; overflow: hidden; box-shadow: var(--shadow); }
.auth__side { background: var(--navy); color: #fff; padding: 48px 40px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; min-height: 560px; }
.auth__side::before { content: ""; position: absolute; width: 420px; height: 420px; border-radius: 50%; background: var(--grad); opacity: .3; right: -140px; top: -120px; }
.auth__side h2 { font-size: 34px; line-height: 1.2; letter-spacing: -.04em; margin: 16px 0 12px; position: relative; }
.auth__side p { color: #b9c1e6; position: relative; }
.auth__side img.prof { width: 70%; margin: 0 auto -48px; position: relative; }
.auth__form { padding: 48px 44px; }
.tabs { display: inline-flex; background: var(--soft); border-radius: 999px; padding: 4px; margin-bottom: 26px; }
.tabs button { border: 0; background: none; padding: 10px 22px; border-radius: 999px; font-weight: 700; color: var(--muted); font-size: 14.5px; }
.tabs button.on { background: #fff; color: var(--ink); box-shadow: 0 2px 10px rgba(0, 0, 0, .08); }
.field { display: grid; gap: 7px; margin-bottom: 18px; }
.field > label, .qlabel { font-weight: 700; font-size: 14.5px; }
.req { color: var(--bad); margin-left: 3px; }
.hint { font-size: 12.5px; color: var(--muted); margin: -2px 0 0; }
input[type=text], input[type=email], input[type=password], input[type=tel], input[type=date], input[type=number], select, textarea {
  width: 100%; font: inherit; padding: 13px 15px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); transition: border-color .2s, box-shadow .2s; }
textarea { min-height: 110px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--c2); box-shadow: 0 0 0 4px rgba(123, 127, 232, .16); }
.err { color: var(--bad); font-size: 13.5px; min-height: 20px; margin: 0 0 8px; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer; font-size: 15px; transition: .15s; }
.opt:hover { border-color: var(--c2); }
.opt input { margin-top: 4px; accent-color: var(--c2d); width: 17px; height: 17px; flex: none; }
.opt:has(input:checked) { border-color: var(--c2); background: rgba(123, 127, 232, .07); }
.opt .other { flex: 1; border: 0; border-bottom: 1.5px solid var(--line); border-radius: 0; padding: 2px 4px; }
.checks { grid-template-columns: repeat(2, 1fr); }

/* form page (구글폼 구조 + 브랜드 상단 배너) */
.fp { background: #eaedfa; min-height: 100vh; padding: 28px 0 80px; }
.fp__wrap { width: min(780px, 100% - 28px); margin: 0 auto; display: grid; gap: 14px; }
.fbanner { position: relative; overflow: hidden; border-radius: 20px; color: #fff; padding: 34px 36px; min-height: 250px; background:
  radial-gradient(520px 260px at 90% 20%, rgba(123, 127, 232, .55), transparent 65%),
  radial-gradient(420px 260px at 10% 110%, rgba(63, 182, 232, .45), transparent 65%), var(--navy); display: flex; align-items: center; }
.fbanner::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, rgba(255, 255, 255, .04) 0 2px, transparent 2px 26px); pointer-events: none; }
.fbanner__t { position: relative; z-index: 2; max-width: 62%; }
.fbanner__logo { height: 26px; width: auto; margin-bottom: 18px; }
.fbanner__k { font-size: 12px; font-weight: 800; letter-spacing: .16em; color: var(--c1); }
.fbanner h1 { font-size: clamp(26px, 4.2vw, 40px); line-height: 1.18; letter-spacing: -.04em; margin: 10px 0 14px; }
.fbanner ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 14px; color: #d4daf7; }
.fbanner ul li::before { content: "▸ "; color: var(--c1); }
.fbanner__img { position: absolute; right: 12px; bottom: 0; width: min(280px, 40%); z-index: 1; }
.fbanner__circle { position: absolute; right: 26px; bottom: -70px; width: 270px; aspect-ratio: 1; border-radius: 50%; background: var(--grad); opacity: .9; }
.fcard { background: #fff; border-radius: 14px; padding: 24px 26px; border: 1px solid #dcdff0; }
.fcard--top { border-top: 10px solid var(--c2); }
.fcard h2 { margin: 0 0 8px; font-size: 24px; letter-spacing: -.03em; }
.info { display: grid; gap: 10px; margin: 16px 0 4px; }
.info div { display: flex; gap: 14px; font-size: 14.5px; } .info dt { width: 84px; color: var(--muted); font-weight: 600; flex: none; } .info dd { margin: 0; font-weight: 600; }
.notice { font-size: 13px; color: var(--muted); background: var(--soft); border-radius: 10px; padding: 12px 14px; white-space: pre-line; }
.dl { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.refpill { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; padding: 7px 14px; border-radius: 999px; background: rgba(123, 127, 232, .12); color: var(--c2d); }
.success { text-align: center; padding: 48px 28px; }
.success .check { width: 76px; height: 76px; border-radius: 50%; background: var(--grad); display: grid; place-items: center; margin: 0 auto 20px; color: #fff; font-size: 38px; }
.success h2 { font-size: 28px; }

/* dashboard / admin */
.dash { display: grid; gap: 24px; }
.dhead { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.dhead h1 { margin: 6px 0 0; font-size: clamp(28px, 3.4vw, 42px); letter-spacing: -.04em; line-height: 1.15; }
.idbox { display: inline-flex; align-items: center; gap: 12px; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px 10px 18px; }
.idbox small { display: block; color: var(--muted); font-size: 12px; font-weight: 600; } .idbox b { font-size: 20px; letter-spacing: .04em; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.kpis--6 { grid-template-columns: repeat(6, 1fr); }
.kpi { background: #fff; border-radius: 20px; padding: 22px 22px 20px; border: 1px solid var(--line); }
.kpi span { font-size: 13px; color: var(--muted); font-weight: 700; } .kpi b { display: block; font-size: clamp(24px, 2.6vw, 34px); letter-spacing: -.04em; margin-top: 6px; line-height: 1.15; }
.kpi small { color: var(--muted); font-size: 12.5px; }
.kpi--grad { background: var(--grad); color: #fff; border: 0; } .kpi--grad span, .kpi--grad small { color: rgba(255, 255, 255, .85); }
.panel { background: #fff; border: 1px solid var(--line); border-radius: 24px; padding: 28px; }
.panel h3 { margin: 0 0 4px; font-size: 20px; letter-spacing: -.03em; } .panel > p.sub { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
.gen { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: end; }
.linkout { margin-top: 16px; display: none; }
.linkout.on { display: block; }
.linkbox { display: flex; gap: 8px; align-items: center; background: var(--soft); border: 1px dashed #c6ccf0; border-radius: 14px; padding: 8px 8px 8px 16px; }
.linkbox code { flex: 1; font-size: 13.5px; overflow: auto; white-space: nowrap; color: var(--ink2); }
.tblwrap { overflow: auto; border: 1px solid var(--line); border-radius: 16px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12.5px; color: var(--muted); background: var(--soft); padding: 12px 14px; white-space: nowrap; position: sticky; top: 0; }
td { padding: 12px 14px; border-top: 1px solid var(--line); vertical-align: middle; }
tr.click { cursor: pointer; } tr.click:hover td { background: #fafbff; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; }
.badge.applied { background: #eaf1ff; color: #2c5fd0; } .badge.confirmed { background: #dff6ee; color: var(--ok); } .badge.cancelled { background: #fde8eb; color: var(--bad); } .badge.settled { background: #efe9ff; color: #6a47d6; } .badge.off { background: #eee; color: #777; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; } .filters > * { width: auto; min-width: 150px; padding: 10px 12px; }
.empty { text-align: center; padding: 48px 12px; color: var(--muted); }
.adtabs { display: flex; gap: 6px; flex-wrap: wrap; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 5px; width: fit-content; max-width: 100%; }
.adtabs button { border: 0; background: none; padding: 10px 20px; border-radius: 999px; font-weight: 700; color: var(--muted); font-size: 14.5px; }
.adtabs button.on { background: var(--ink); color: #fff; }
.cgrid { display: grid; gap: 20px; }
.cedit { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 16px; }
.cedit .wide { grid-column: 1 / -1; }
.dates { display: grid; gap: 8px; }
.drow { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
.toggle input { width: 18px; height: 18px; accent-color: var(--c2d); }
.modal { position: fixed; inset: 0; background: rgba(10, 18, 51, .55); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
.modal.on { display: flex; }
.modal__box { background: #fff; border-radius: 24px; width: min(760px, 100%); max-height: 90vh; overflow: auto; padding: 32px; }
.modal__box h3 { margin: 0 0 18px; font-size: 22px; }
.kv { display: grid; grid-template-columns: 150px 1fr; gap: 10px 16px; font-size: 14.5px; } .kv dt { color: var(--muted); font-weight: 600; } .kv dd { margin: 0; word-break: break-all; white-space: pre-wrap; }
.mact { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--line); }

#toasts { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); display: grid; gap: 8px; z-index: 200; }
.toast { background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 999px; font-weight: 600; font-size: 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, .25); animation: tin .3s; }
.toast.err { background: var(--bad); } .toast.out { opacity: 0; transition: .4s; }
@keyframes tin { from { transform: translateY(12px); opacity: 0; } }

.reveal { opacity: 0; transform: translateY(28px); transition: opacity .8s cubic-bezier(.2, .7, .2, 1), transform .8s cubic-bezier(.2, .7, .2, 1); }
.reveal.in { opacity: 1; transform: none; }

@media (max-width: 1024px) {
  .course { grid-template-columns: 1fr; gap: 20px; padding: 30px 26px; } .course__no { font-size: 48px; }
  .rev, .hero__in, .auth, .ft__in { grid-template-columns: 1fr; }
  .steps { grid-template-columns: repeat(2, 1fr); } .kpis, .kpis--6 { grid-template-columns: repeat(2, 1fr); }
  .hero__art { min-height: 420px; } .auth__side { min-height: 0; } .auth__side img.prof { display: none; }
}
@media (max-width: 760px) {
  .container { width: calc(100% - 32px); }
  .hd__in { height: 64px; gap: 12px; } .hd__burger { display: block; } .hd__auth { display: none; }
  .hd__nav { display: none; position: absolute; top: 64px; left: 0; right: 0; background: #fff; padding: 18px 24px 24px; flex-direction: column; gap: 14px; border-bottom: 1px solid var(--line); margin: 0; }
  .nav-open .hd__nav { display: flex; }
  .nav-open .hd__nav::after { content: ""; }
  .hero { padding-top: 40px; } .hero__cta { padding-bottom: 36px; } .hero__badge { display: none; } .hero__art { min-height: 340px; }
  .steps, .checks, .cedit, .gen, .mact, .drow { grid-template-columns: 1fr; } .actions .row { grid-template-columns: 1fr; }
  .fbanner { padding: 24px 22px 150px; } .fbanner__t { max-width: 100%; } .fbanner__img { width: 150px; right: 6px; } .fbanner__circle { width: 170px; right: 0; bottom: -50px; }
  .auth__form { padding: 32px 24px; } .panel { padding: 22px 18px; } .kv { grid-template-columns: 1fr; gap: 2px 0; } .kv dd { margin-bottom: 8px; }
  .meta { grid-template-columns: 70px 1fr; }
}
@media (prefers-reduced-motion: reduce) { .marquee__t { animation: none; } .reveal { opacity: 1; transform: none; transition: none; } html { scroll-behavior: auto; } }

    letters.forEach((l, i) => {
      let target = 0;
      if (st.wave) {

  ui.replay?.addEventListener("click", play);

  ui.waveBtn?.addEventListener("click", () => { st.wave = !st.wave; ui.waveBtn.setAttribute("aria-pressed", st.wave); report(); });
